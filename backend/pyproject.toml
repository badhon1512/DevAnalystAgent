[project]
name = "tracestock-ai-backend"
version = "0.1.0"
description = "FastAPI and LangGraph backend for the TraceStock AI agentic inventory analyst."
readme = "../README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "sqlalchemy==2.0.32",
    "psycopg[binary]==3.2.1",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.2",
    "redis==5.0.8",
    "celery==5.4.0",
    "langgraph==0.2.35",
    "langchain==0.2.16",
    "langchain-community==0.2.16",
    "langchain-openai==0.1.22",
    "langchain-groq==0.1.10",
    "python-dotenv==1.0.1",
    "ipython==8.27.0",
    "faiss-cpu==1.8.0.post1",
    "tiktoken==0.7.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "matplotlib==3.8.4",
    "openpyxl==3.1.5",
    "reportlab==4.2.2",
    "httpx==0.27.0",
    "structlog==24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "ruff==0.6.2",
]
voice = [
    "openai-whisper",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
